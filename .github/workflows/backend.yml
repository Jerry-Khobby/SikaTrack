name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "data-engineering/src/**"
      - "data-engineering/pyproject.toml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "data-engineering/src/**"
      - "data-engineering/pyproject.toml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sika
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U sika"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sika:ci-only-password@localhost:5434/postgres
      REQUIRE_DATABASE: "1"   # integration tests must run here, not skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            data-engineering/pyproject.toml

      - name: Install
        run: pip install -e ../data-engineering -e ".[dev]"  # the shared pipeline code first

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: python -m pytest --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f Dockerfile -t sikatrack-api:ci ..  # context: the repo root
      - name: Starts and answers /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_PASSWORD=x -e S3_ACCESS_KEY=x -e S3_SECRET_KEY=x \
            -e JWT_SECRET=ci-only-jwt-secret-at-least-32-characters \
            -e OTP_PEPPER=ci-only-otp-pepper-at-least-32-characters \
            -e INTERNAL_API_TOKEN=ci-only-internal-token-at-least-32-chars \
            -e PIPELINE_SCHEDULER_ENABLED=false sikatrack-api:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
