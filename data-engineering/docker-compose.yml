# SikaTrack data-engineering stack
#
#                         Airflow (orchestrates every step)
#   SMS backup XML ──► RustFS raw ──► pandas transform ──► RustFS processed (Parquet)
#                                                              │
#                       Metabase / Power BI ◄── Postgres star schema (warehouse) ◄┘
#
# Usage:
#   cp .env.example .env            # then fill in the secrets
#   docker compose up -d --build
#
# Airflow UI:    http://localhost:8080   (user/pass from .env)
# RustFS console: http://localhost:9001/rustfs/console/   (S3-compatible; MinIO no longer ships images)
# Power BI:      Get Data -> PostgreSQL -> localhost:5434, database sikatrack_dw
# Metabase:      http://localhost:3000   (dashboards on the mart views; setup in docs/metabase.md)

# ---------------------------------------------------------------------
# Shared Airflow config (Airflow 3: api-server + scheduler + dag-processor)
# ---------------------------------------------------------------------
x-airflow-common: &airflow-common
  # Built once by airflow-init (below); every other service reuses the same image.
  image: sikatrack-airflow:${AIRFLOW_VERSION:-3.0.6}
  pull_policy: never
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    # Must be identical on every component, or task runs fail JWT validation
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Pipeline code reads these; in-network values override the host ones in .env
    S3_ENDPOINT: http://rustfs:9000
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "5432"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - ./src:/opt/sikatrack/src
    - ./sql:/opt/sikatrack/sql:ro   # schema migrations, applied by the load step
    - ./data:/opt/sikatrack/data
  networks:
    - sikatrack

x-airflow-depends: &airflow-depends
  airflow-db:
    condition: service_healthy
  airflow-init:
    condition: service_completed_successfully

services:
  # ===================================================================
  # Data platform
  # ===================================================================

  # Object storage: the data lake (raw XML + processed Parquet), S3-compatible
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: sikatrack-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${S3_API_PORT:-9000}:9000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sikatrack

  # One-shot: create the lake buckets with boto3 (idempotent, safe to re-run)
  lake-init:
    <<: *airflow-common
    container_name: sikatrack-lake-init
    entrypoint: ["python", "-m", "src.lake.init_buckets"]
    command: []
    working_dir: /opt/sikatrack
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  # OLAP warehouse: star schema that Power BI reads from
  warehouse:
    image: postgres:16-alpine
    container_name: sikatrack-warehouse
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB}
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${WAREHOUSE_HOST_PORT:-5434}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      # The dw schema is created and evolved by the load step (sql/migrations/), not on first start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER} -d ${WAREHOUSE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sikatrack

  # ===================================================================
  # Airflow (orchestration)
  # ===================================================================

  # Airflow's own metadata DB, kept separate from the warehouse
  airflow-db:
    image: postgres:16-alpine
    container_name: sikatrack-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sikatrack

  # One-shot: migrate the metadata DB and create the admin user
  airflow-init:
    <<: *airflow-common
    build:
      context: .
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.0.6}
    pull_policy: build
    container_name: sikatrack-airflow-init
    entrypoint: /bin/bash
    command: ["-c", "exec /entrypoint airflow version"]
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  # UI + REST API + the execution API that tasks report back to
  airflow-apiserver:
    <<: *airflow-common
    container_name: sikatrack-airflow-apiserver
    command: api-server
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
    restart: unless-stopped

  # Schedules DAG runs; with LocalExecutor the pipeline tasks execute here,
  # so it also waits for the lake buckets and the warehouse
  airflow-scheduler:
    <<: *airflow-common
    container_name: sikatrack-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      lake-init:
        condition: service_completed_successfully
      warehouse:
        condition: service_healthy
    restart: unless-stopped

  # Parses files in dags/ (a separate process in Airflow 3)
  airflow-dag-processor:
    <<: *airflow-common
    container_name: sikatrack-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
    restart: unless-stopped

  # ===================================================================
  # Metabase (dashboards)
  # ===================================================================

  # Metabase's own application DB (questions, dashboards, users), kept apart from the warehouse
  metabase-db:
    image: postgres:16-alpine
    container_name: sikatrack-metabase-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sikatrack

  # One-shot: create/update the read-only login Metabase uses (members of mart_reader see
  # only the mart views). Idempotent; re-run after changing METABASE_READER_PASSWORD.
  metabase-reader-init:
    image: postgres:16-alpine
    container_name: sikatrack-metabase-reader-init
    environment:
      PGHOST: warehouse
      PGUSER: ${WAREHOUSE_USER}
      PGPASSWORD: ${WAREHOUSE_PASSWORD}
      PGDATABASE: ${WAREHOUSE_DB}
      METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD}
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -v reader_password=\"$$METABASE_READER_PASSWORD\" -f /sql/metabase_reader.sql"]
    volumes:
      - ./scripts/metabase_reader.sql:/sql/metabase_reader.sql:ro
    depends_on:
      warehouse:
        condition: service_healthy
    restart: "no"
    networks:
      - sikatrack

  metabase:
    image: metabase/metabase:v0.63.16.6
    container_name: sikatrack-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: Africa/Accra
      JAVA_OPTS: -Xmx1g
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${METABASE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      metabase-db:
        condition: service_healthy
      metabase-reader-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - sikatrack

volumes:
  rustfs_data:
  warehouse_data:
  airflow_db_data:
  metabase_db_data:

networks:
  sikatrack:
    driver: bridge
