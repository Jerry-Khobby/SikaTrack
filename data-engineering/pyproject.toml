# Makes the pipeline's code installable, so the backend uses the same SMS parser, message IDs
# and category rules instead of a copy:  pip install -e ../data-engineering
#
# The pipeline itself still runs from this folder (Airflow image, tests); dependencies for that
# stay in requirements.txt. This lists only what the shared modules need.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sikatrack-pipeline"
version = "0.1.0"
description = "SikaTrack data layer: SMS parsing, transform rules and warehouse loading"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<3",
    "python-dotenv>=1.0,<2",
]

[tool.hatch.build]
# The repo's root .gitignore excludes __init__.py files; list the package's files directly
ignore-vcs = true
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
